<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel da Obra Theo</title>
<style>
:root{--fg:#1c2b3a;--muted:#5b6b7d;--line:#e2e8f0;--panel:#f7f9fc;--bg:#ffffff;--blue:#1d4e89}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,Arial,sans-serif;padding:0 16px 40px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:24px;margin:18px 0 4px}
h2{font-size:18px;margin:24px 0 8px}
.sub{font-size:13px;color:var(--muted)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.filtros select,.filtros input,.filtros button{font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg)}
.filtros input{flex:1;min-width:180px}
.filtros button{cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;min-height:4px}
.ativo{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--blue);color:#fff;cursor:pointer}
.ativo:after{content:' \00d7';font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel);cursor:pointer}
.kpi:hover{transform:translateY(-2px)}
.kpi.on{outline:2px solid var(--blue)}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .p{font-size:13px;color:var(--muted);margin-top:2px}
.split{display:flex;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.split div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;cursor:pointer}
.split div.on{box-shadow:inset 0 0 0 3px #fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.barra{display:grid;grid-template-columns:150px 1fr 200px;gap:10px;align-items:center;margin:7px 0;font-size:14px;cursor:pointer;padding:5px 8px;border-radius:8px}
.barra.on{background:var(--panel);outline:2px solid var(--blue)}
.track{height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.fill{height:100%;border-radius:7px}
.num{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;align-items:end;height:200px;border-bottom:1px solid var(--line)}
.mcol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;cursor:pointer;padding:4px 0;border-radius:6px}
.mcol.on{background:var(--panel);outline:2px solid var(--blue)}
.mcol .b{width:68%;background:var(--blue);border-radius:4px 4px 0 0}
.mcol .n{font-size:11px;margin-bottom:4px;font-variant-numeric:tabular-nums;text-align:center}
.mcol .t{font-size:12px;color:var(--muted);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.scroll{overflow-x:auto}
.note{font-size:13px;color:var(--muted);margin:8px 0}
.defin{font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px}
@media(max-width:600px){.barra{grid-template-columns:110px 1fr}.barra .num{grid-column:1/-1;text-align:left}}
</style>
</head>
<body>
<div class="wrap">
<div id="topo"></div>
<div id="app"></div>
</div>
<script>
const DATA=[{"data":"2025-12-20","valor":"320000","grupo":"Terreno","categoria":"Terreno","fornecedor":"Nivaldo","forma_pagamento":"PARCELADO PIX"},{"data":"2026-01-30","valor":"700","grupo":"Mão de obra","categoria":"Topografo","fornecedor":"Atilio","forma_pagamento":"PIX IGOR"},{"data":"2026-04-29","valor":"4500","grupo":"Mão de obra","categoria":"Terraplanagem - Limpeza","fornecedor":"Marcos","forma_pagamento":"PIX"},{"data":"2026-04-30","valor":"117.5","grupo":"Materiais","categoria":"Cano","fornecedor":"Bença","forma_pagamento":"PIX IGOR"},{"data":"2026-05-04","valor":"21085","grupo":"Materiais","categoria":"Material Diverso","fornecedor":"Bença","forma_pagamento":"PARCELADO PIX"},{"data":"2026-05-05","valor":"1650","grupo":"Materiais","categoria":"Ferro","fornecedor":"Vermei","forma_pagamento":"PIX"},{"data":"2026-05-05","valor":"1200","grupo":"Materiais","categoria":"Locação de container (05/05 a 05/10, R$ 200/mês × 6)","fornecedor":"Denis Container","forma_pagamento":"PIX"},{"data":"2026-05-06","valor":"1400","grupo":"Materiais","categoria":"Poste Eletrico","fornecedor":"AmeriPoste","forma_pagamento":"PIX"},{"data":"2026-05-08","valor":"3500","grupo":"Mão de obra","categoria":"Alicerce Broca","fornecedor":"Marcio Preto","forma_pagamento":"PIX"},{"data":"2026-05-13","valor":"216.6","grupo":"Materiais","categoria":"Material Diverso","fornecedor":"Bença","forma_pagamento":"PIX"},{"data":"2026-05-14","valor":"2000","grupo":"Materiais","categoria":"Concreto","fornecedor":"Cival","forma_pagamento":"PIX"},{"data":"2026-05-15","valor":"3700","grupo":"Mão de obra","categoria":"Pedreiro Mão de Obra","fornecedor":"Marcio","forma_pagamento":"PIX"},{"data":"2026-05-15","valor":"117","grupo":"Materiais","categoria":"Bloco","fornecedor":"Barbosa","forma_pagamento":"PIX"},{"data":"2026-05-15","valor":"30","grupo":"Materiais","categoria":"Numero Frontal","fornecedor":"Barbosa","forma_pagamento":"PIX"},{"data":"2026-05-19","valor":"4750","grupo":"Materiais","categoria":"Cimento","fornecedor":"Engemix","forma_pagamento":"PIX"},{"data":"2026-05-20","valor":"850","grupo":"Mão de obra","categoria":"Bomba cimento","fornecedor":"Bombas Lider","forma_pagamento":"PIX"},{"data":"2026-06-01","valor":"2255","grupo":"Materiais","categoria":"Material Diverso","fornecedor":"Barbosa","forma_pagamento":"PIX"},{"data":"2026-06-11","valor":"3500","grupo":"Mão de obra","categoria":"Terraplanagem - Aterramento","fornecedor":"Miller","forma_pagamento":"PIX"},{"data":"2026-06-12","valor":"4000","grupo":"Mão de obra","categoria":"Pedreiro Mão de Obra","fornecedor":"Marcio","forma_pagamento":"PIX"},{"data":"2026-06-16","valor":"6400","grupo":"Materiais","categoria":"Bloco - Tijolo","fornecedor":"Tatu","forma_pagamento":"PIX"},{"data":"2026-06-17","valor":"2876","grupo":"Materiais","categoria":"Material Diverso","fornecedor":"Bença","forma_pagamento":"PIX"},{"data":"2026-06-18","valor":"57","grupo":"Materiais","categoria":"Cano esgoto","fornecedor":"Vermei","forma_pagamento":"PIX"},{"data":"2026-06-22","valor":"2080","grupo":"Materiais","categoria":"Material Diverso","fornecedor":"Barbosa","forma_pagamento":"PIX"},{"data":"2026-06-26","valor":"4500","grupo":"Mão de obra","categoria":"Pedreiro Mão de Obra","fornecedor":"Marcio","forma_pagamento":"PIX"},{"data":"2026-07-08","valor":"450","grupo":"Materiais","categoria":"Ligação de água e esgoto","fornecedor":"DAE","forma_pagamento":"PIX"},{"data":"2026-07-10","valor":"4500","grupo":"Mão de obra","categoria":"Pedreiro Mão de Obra","fornecedor":"Marcio","forma_pagamento":"PIX"},{"data":"2026-07-14","valor":"4019.42","grupo":"Materiais","categoria":"Bloco - Tijolo","fornecedor":"Tatu","forma_pagamento":"PIX"},{"data":"2026-07-15","valor":"180","grupo":"Materiais","categoria":"Locação perfurador solo","fornecedor":"Marcos Valentin","forma_pagamento":"PIX"},{"data":"2026-07-15","valor":"3380","grupo":"Materiais","categoria":"Material Diverso","fornecedor":"Barbosa","forma_pagamento":"CARTÃO DE CRÉDITO"},{"data":"2026-07-15","valor":"349.5","grupo":"Materiais","categoria":"Material Diverso - Picadeira (Marcio)","fornecedor":"Barbosa","forma_pagamento":"PIX"},{"data":"2026-07-16","valor":"240","grupo":"Materiais","categoria":"Locação compactador","fornecedor":"Marcos Valentin","forma_pagamento":"PIX"},{"data":"2026-07-24","valor":"11200","grupo":"Mão de obra","categoria":"Pedreiro Mão de Obra","fornecedor":"Marcio","forma_pagamento":"PIX"},{"data":"2026-07-30","valor":"2700","grupo":"Materiais","categoria":"Material Diverso","fornecedor":"Barbosa","forma_pagamento":"PIX"},{"data":"2026-08-07","valor":"3500","grupo":"Mão de obra","categoria":"Pedreiro Mão de Obra","fornecedor":"Marcio","forma_pagamento":"PIX"},{"data":"2026-08-12","valor":"1500","grupo":"Mão de obra","categoria":"Pedreiro Mão de Obra","fornecedor":"Marcio","forma_pagamento":"PIX"},{"data":"2026-08-13","valor":"1550","grupo":"Materiais","categoria":"Material Diverso","fornecedor":"Bença","forma_pagamento":"PIX"},{"data":"2026-08-14","valor":"258","grupo":"Materiais","categoria":"Material Diverso","fornecedor":"Bença","forma_pagamento":"PIX"},{"data":"2026-08-20","valor":"1656","grupo":"Materiais","categoria":"Material Diverso","fornecedor":"Bença","forma_pagamento":"PIX"},{"data":"2026-08-21","valor":"5000","grupo":"Mão de obra","categoria":"Pedreiro Mão de Obra","fornecedor":"Marcio","forma_pagamento":"PIX"},{"data":"2026-08-26","valor":"1386.06","grupo":"Materiais","categoria":"Canos","fornecedor":"Juninho JJ","forma_pagamento":"PIX"},{"data":"2026-09-03","valor":"780","grupo":"Materiais","categoria":"Material Diverso","fornecedor":"Vermei","forma_pagamento":"PIX"},{"data":"2026-09-04","valor":"4000","grupo":"Mão de obra","categoria":"Pedreiro Mão de Obra","fornecedor":"Marcio","forma_pagamento":"PIX"},{"data":"2026-09-18","valor":"4000","grupo":"Mão de obra","categoria":"Pedreiro Mão de Obra","fornecedor":"Marcio","forma_pagamento":"PIX"},{"data":"2026-09-22","valor":"6200","grupo":"Materiais","categoria":"Material Diverso","fornecedor":"Barbosa","forma_pagamento":"PIX"},{"data":"2026-09-29","valor":"434","grupo":"Materiais","categoria":"Materiais elétricos","fornecedor":"Meta","forma_pagamento":"CARTÃO DE CRÉDITO"},{"data":"2026-10-02","valor":"6500","grupo":"Mão de obra","categoria":"Pedreiro Mão de Obra","fornecedor":"Marcio","forma_pagamento":"PIX"},{"data":"2026-10-05","valor":"10000","grupo":"Mão de obra","categoria":"Cobertura e portão","fornecedor":"Alemão","forma_pagamento":"PIX"},{"data":"2026-10-05","valor":"230","grupo":"Materiais","categoria":"Material Diverso","fornecedor":"Vermei","forma_pagamento":"PIX"},{"data":"2026-10-15","valor":"1636","grupo":"Mão de obra","categoria":"Cascata piscina","fornecedor":"Robinho","forma_pagamento":"PIX"},{"data":"2026-10-16","valor":"4500","grupo":"Mão de obra","categoria":"Pedreiro Mão de Obra","fornecedor":"Marcio","forma_pagamento":"PIX"},{"data":"2026-10-20","valor":"5000","grupo":"Mão de obra","categoria":"Cobertura e portão","fornecedor":"Alemão","forma_pagamento":"PIX"},{"data":"2026-10-21","valor":"900","grupo":"Mão de obra","categoria":"Cobertura e portão","fornecedor":"Alemão","forma_pagamento":"PIX"}];
const dash={data:()=>({status:'ok',data:DATA}),onData:f=>f()};
const BRL=v=>'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const BRL0=v=>'R$ '+Math.round(Number(v)).toLocaleString('pt-BR');
const pct=(v,t)=>t?(v/t*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%':'—';
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const COR={'Terreno':'#1d4e89','Materiais':'#e07b00','Mão de obra':'#1b6b4a'};
const corDe=g=>COR[g]||'#8aa4bf';
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const app=document.getElementById('app');
const topo=document.getElementById('topo');
let ROWS=[];
let st={grupo:null,fornecedor:null,forma:null,mes:null,busca:''};
function parse(d){return (d.data||[]).map(r=>({data:String(r.data||''),valor:Number(String(r.valor).replace(',','.'))||0,grupo:String(r.grupo||'').trim(),categoria:String(r.categoria||'').trim(),fornecedor:String(r.fornecedor||'').trim(),forma:String(r.forma_pagamento||'').trim()}))}
function ativo(r){if(st.grupo==='Outros'&&r.grupo==='Terreno')return false;if(st.grupo&&st.grupo!=='Outros'&&r.grupo!==st.grupo)return false;if(st.fornecedor&&r.fornecedor!==st.fornecedor)return false;if(st.forma&&r.forma!==st.forma)return false;if(st.mes&&r.data.slice(0,7)!==st.mes)return false;if(st.busca){const q=st.busca.toLowerCase();if(!(r.categoria+' '+r.fornecedor+' '+r.grupo).toLowerCase().includes(q))return false}return true}
function soma(rows){return rows.reduce((s,r)=>s+r.valor,0)}
function agrupa(rows,key){const o={};rows.forEach(r=>{const k=key(r);o[k]=(o[k]||0)+r.valor});return o}
function toggle(campo,valor){st[campo]=(st[campo]===valor?null:valor);render()}
app.addEventListener('click',e=>{const t=e.target.closest('[data-set]');if(t){toggle(t.dataset.set,t.dataset.val)}});
topo.addEventListener('click',e=>{const t=e.target.closest('[data-clear]');if(t){st.grupo=null;st.fornecedor=null;st.forma=null;st.mes=null;st.busca='';montaTopo();render()}});
function montaTopo(){const forns=[...new Set(ROWS.map(r=>r.fornecedor).filter(Boolean))].sort();const formas=[...new Set(ROWS.map(r=>r.forma).filter(Boolean))].sort();topo.innerHTML=`<h1>Painel da Obra Theo</h1><div class='sub'>Clique em qualquer item para filtrar. Todos os valores se recalculam juntos.</div><div class='filtros'><select id='f_for'><option value=''>Todos os fornecedores</option>${forns.map(f=>`<option value='${esc(f)}'${st.fornecedor===f?' selected':''}>${esc(f)}</option>`).join('')}</select><select id='f_forma'><option value=''>Todas as formas de pagamento</option>${formas.map(f=>`<option value='${esc(f)}'${st.forma===f?' selected':''}>${esc(f)}</option>`).join('')}</select><input id='f_busca' placeholder='Buscar por categoria, fornecedor ou grupo' value='${esc(st.busca)}'><button data-clear='tudo'>Limpar filtros</button></div>`;document.getElementById('f_for').onchange=e=>{st.fornecedor=e.target.value||null;render()};document.getElementById('f_forma').onchange=e=>{st.forma=e.target.value||null;render()};document.getElementById('f_busca').oninput=e=>{st.busca=e.target.value;render()}}
function chipsHtml(){const c=[];if(st.grupo)c.push(['grupo',st.grupo==='Outros'?'Outros custos (sem terreno)':st.grupo]);if(st.fornecedor)c.push(['fornecedor','Fornecedor: '+st.fornecedor]);if(st.forma)c.push(['forma','Forma: '+st.forma]);if(st.mes){const [y,m]=st.mes.split('-');c.push(['mes','Mês: '+MESES[Number(m)-1]+'/'+y])}if(st.busca)c.push(['busca','Busca: '+st.busca]);if(!c.length)return `<div class='note'>Nenhum filtro ativo. Clique em um card, barra, fornecedor ou mês para filtrar tudo ao mesmo tempo.</div>`;return c.map(([k,t])=>`<span class='ativo' data-set='${k}' data-val=''>${esc(t)}</span>`).join('')}
function render(){ROWS=parse(dash.data('gastos'));if(!topo.dataset.ok){montaTopo();topo.dataset.ok='1'}const F=ROWS.filter(ativo);const tAll=soma(ROWS);const tF=soma(F);const porG=agrupa(F,r=>r.grupo);const terreno=porG['Terreno']||0;const outros=tF-terreno;const maoObra=porG['Mão de obra']||0;const materiais=porG['Materiais']||0;let h='';h+=`<div class='chips'>${chipsHtml()}</div>`;h+=`<div class='kpis'>`+[['Total gasto',tF,'',true],['Terreno',terreno,'Terreno',false],['Materiais',materiais,'Materiais',false],['Mão de obra',maoObra,'Mão de obra',false]].map(([l,v,g,totalCard])=>`<div class='kpi${g&&st.grupo===g?' on':''}' data-set='grupo' data-val='${esc(g)}'><div class='l'>${l}</div><div class='v'>${totalCard?BRL(v):BRL0(v)}</div><div class='p'>${pct(v,tAll)} do total geral</div></div>`).join('')+`</div>`;h+=`<h2>Terreno x outros custos</h2><div class='split'><div class='${st.grupo==='Terreno'?'on':''}' data-set='grupo' data-val='Terreno' style='width:${tF?terreno/tF*100:0}%;background:${COR.Terreno}'>${pct(terreno,tF)}</div><div class='${st.grupo==='Outros'?'on':''}' data-set='grupo' data-val='Outros' style='width:${tF?outros/tF*100:0}%;background:#8aa4bf'>${pct(outros,tF)}</div></div><div class='legend'><span><i class='dot' style='background:${COR.Terreno}'></i>Terreno: ${BRL(terreno)}</span><span><i class='dot' style='background:#8aa4bf'></i>Outros custos: ${BRL(outros)}</span></div><div class='defin'><b>Outros custos</b> = tudo o que não é terreno: materiais, mão de obra e serviços.</div>`;const porF=agrupa(F,r=>r.fornecedor||'Sem fornecedor');const fornOrd=Object.entries(porF).sort((a,b)=>b[1]-a[1]);const fMax=Math.max(...fornOrd.map(x=>x[1]),1);h+=`<h2>Por fornecedor</h2>`+fornOrd.map(([f,v])=>`<div class='barra${st.fornecedor===f?' on':''}' data-set='fornecedor' data-val='${esc(f)}'><span>${esc(f)}</span><div class='track'><div class='fill' style='width:${v/fMax*100}%;background:#1d4e89'></div></div><span class='num'>${BRL0(v)} · ${pct(v,tF)}</span></div>`).join('');const meses=[...new Set(ROWS.map(r=>r.data.slice(0,7)).filter(Boolean))].sort();const porM=agrupa(F.filter(r=>r.data),r=>r.data.slice(0,7));const mMax=Math.max(...meses.map(m=>porM[m]||0),1);h+=`<h2>Gastos por mês</h2><div class='months'>`+meses.map(m=>{const [y,mm]=m.split('-');const v=porM[m]||0;return `<div class='mcol${st.mes===m?' on':''}' data-set='mes' data-val='${m}'><div class='n'>${BRL0(v)}</div><div class='b' style='height:${v/mMax*100}%'></div><div class='t'>${MESES[Number(mm)-1]}/${y.slice(2)}</div></div>`}).join('')+`</div><div class='note'>Clique em um mês para filtrar. Clique de novo para desfazer.</div>`;const lista=F.slice().sort((a,b)=>a.data.localeCompare(b.data));h+=`<h2>Lançamentos</h2><div class='note'>${lista.length} lançamentos · ${BRL(tF)}</div><div class='scroll'><table><thead><tr><th>Data</th><th>Grupo</th><th>Categoria</th><th>Fornecedor</th><th>Forma</th><th class='num'>Valor</th></tr></thead><tbody>`+lista.map(r=>`<tr><td>${esc(r.data?r.data.split('-').reverse().join('/'):'sem data')}</td><td>${esc(r.grupo)}</td><td>${esc(r.categoria)}</td><td>${esc(r.fornecedor)}</td><td>${esc(r.forma)}</td><td class='num'>${BRL(r.valor)}</td></tr>`).join('')+`</tbody></table></div>`;app.innerHTML=h}
render();
</script>
</body>
</html>
